name: Stage htail 0.16.4

on:
  push:
    branches:
      - ux/global-search-0164
    paths:
      - tools/stage_0164.py
      - .github/workflows/stage-0164.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/bundle-requirements.txt
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check RapidFuzz==3.14.5
      - name: Apply patch
        run: |
          sed -i 's/    """# htail/    "# htail/' tools/stage_0164.py
          python tools/stage_0164.py
      - name: Compile
        run: python -m compileall -q src tools tests benchmarks
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_global_search_0164 tests.test_global_search_016 tests.test_global_search_0162 -v
      - name: Run full tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Differential gate
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0
      - name: Build and smoke
        run: |
          python tools/build_release.py --output /tmp/htail
          python tools/build_runtime.py --output-dir /tmp/runtime --abi cp313
          python tools/build_runtime.py --self-test /tmp/runtime/htail-runtime-cp313.zip
          test "$(python /tmp/htail --version)" = "htail 0.16.4"
      - name: Commit validated patch and remove staging helpers
        run: |
          rm -f tools/stage_0164.py .github/workflows/stage-0164.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "htail 0.16.4: improve global search navigation"
          git push origin HEAD:ux/global-search-0164
