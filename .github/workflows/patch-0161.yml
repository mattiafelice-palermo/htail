name: Stage htail 0.16.1

on:
  push:
    branches:
      - fix/ci-esc-global-search-0.16.1
    paths:
      - .github/patch_0161_v6.py
      - .github/workflows/patch-0161.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-esc-global-search-0.16.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/bundle-requirements.txt
      - name: Apply preparation patch
        run: python .github/patch_0161_v6.py
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check RapidFuzz==3.14.5
      - name: Compile
        run: python -m compileall -q src tools tests benchmarks
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0
      - name: Build universal core
        run: time python tools/build_release.py --output /tmp/htail
      - name: Build current-ABI runtime
        run: time python tools/build_runtime.py --output-dir /tmp/runtime --abi cp313
      - name: Smoke runtime
        run: python tools/build_runtime.py --self-test /tmp/runtime/htail-runtime-cp313.zip
      - name: Smoke prepared core
        env:
          PYTHONPATH: src
          XDG_CACHE_HOME: /tmp/htail-stage-cache
        run: |
          python /tmp/htail --prepare-core
          python /tmp/htail --version
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools tests
          git commit -m "Prepare application before update restart"
          git push origin HEAD:fix/ci-esc-global-search-0.16.1
