name: Apply htail 0.7.3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.7.3 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('htail')
          text = path.read_text(encoding='utf-8')
          assert 'HTAIL_VERSION = "0.7.2"' in text
          text = text.replace('HTAIL_VERSION = "0.7.2"', 'HTAIL_VERSION = "0.7.3"', 1)

          release_block = '''@dataclass(frozen=True)\nclass ReleaseInfo:\n    version: str\n    tag: str\n    asset_url: str\n    asset_name: str\n    checksum_url: Optional[str] = None\n'''
          assert release_block in text
          release_block += '''    notes: str = ""\n\n\ndef _clean_release_note_line(text: str) -> str:\n    """Reduce simple Markdown in release notes to compact terminal text."""\n    text = text.strip()\n    text = re.sub(r"^[-*+]\\s+", "", text)\n    text = re.sub(r"`([^`]+)`", r"\\1", text)\n    text = re.sub(r"\\*\\*([^*]+)\\*\\*|__([^_]+)__", lambda m: m.group(1) or m.group(2), text)\n    text = re.sub(r"\\[([^\\]]+)\\]\\([^)]+\\)", r"\\1", text)\n    return text.strip()\n\n\ndef release_note_sections(notes: str) -> Tuple[List[str], List[str], List[str]]:\n    """Return categorized (features, bug fixes, other) GitHub release notes."""\n    features: List[str] = []\n    fixes: List[str] = []\n    other: List[str] = []\n    section: Optional[str] = None\n    for raw in notes.splitlines():\n        line = raw.strip()\n        if not line:\n            continue\n        heading = re.match(r"^#{1,6}\\s+(.+)$", line)\n        if heading:\n            name = heading.group(1).strip().lower()\n            if "feature" in name or "enhancement" in name or name == "new":\n                section = "features"\n            elif "bug" in name or name in {"fixes", "fix"}:\n                section = "fixes"\n            else:\n                section = None\n            continue\n        if re.match(r"^[-*+]\\s+", line):\n            item = _clean_release_note_line(line)\n            if section == "features":\n                features.append(item)\n            elif section == "fixes":\n                fixes.append(item)\n            else:\n                other.append(item)\n    return features, fixes, other\n'''
          old_release = '''@dataclass(frozen=True)\nclass ReleaseInfo:\n    version: str\n    tag: str\n    asset_url: str\n    asset_name: str\n    checksum_url: Optional[str] = None\n'''
          text = text.replace(old_release, release_block, 1)

          text = text.replace(
              '        version = tag.lstrip("vV")\n        if not tag or not is_newer_version(version, HTAIL_VERSION):',
              '        version = tag.lstrip("vV")\n        notes = str(payload.get("body") or "")\n        if not tag or not is_newer_version(version, HTAIL_VERSION):',
              1,
          )
          text = text.replace(
              '            checksum_url=checksum_url,\n        )',
              '            checksum_url=checksum_url,\n            notes=notes,\n        )',
              1,
          )

          body_anchor = '''    def body_height(self) -> int:\n        width, height = self.dimensions()\n        return max(1, height - self.footer_height(width))\n'''
          assert body_anchor in text
          content_width = '''    def content_width(self) -> int:\n        # Keep the terminal's final physical column unused. Filling it can set\n        # an implicit-wrap flag, causing the next newline to consume an extra\n        # row and letting the fixed footer overwrite body content.\n        return max(1, self.dimensions()[0] - 1)\n\n'''
          text = text.replace(body_anchor, content_width + body_anchor, 1)
          text = text.replace('            width = self.dimensions()[0]\n        self._ensure_layout(width)', '            width = self.content_width()\n        self._ensure_layout(width)')
          text = text.replace('        width = self.dimensions()[0]\n        self._ensure_layout(width)', '        width = self.content_width()\n        self._ensure_layout(width)')

          old_controls = '''        update_control = " · u update" if self.update_release is not None else ""\n        if width >= 108:\n            controls = "↑↓/Pg scroll · [/] update · f newest · p pause · c clear" + update_control + " · q quit · ? help"\n        else:\n            controls = "↑↓/Pg · [/] update · f newest · p pause · c clear" + update_control + " · q quit · ? help"\n'''
          new_controls = '''        if self.update_release is not None:\n            update_control = " · u update"\n        elif self.update_service is not None and self.update_service.enabled:\n            update_control = " · u check"\n        else:\n            update_control = ""\n        if width >= 108:\n            controls = "↑↓/Pg scroll · [/] update · f newest · p pause · c clear" + update_control + " · q quit · ? help"\n        else:\n            controls = "↑↓/Pg · [/] update · f newest · p pause · c clear" + update_control + " · q quit · ? help"\n'''
          assert old_controls in text
          text = text.replace(old_controls, new_controls, 1)
          text = text.replace('            "  u           confirm/install an available release update",', '            "  u           check for updates / install an available release",', 1)

          start = text.index('    def _update_modal_lines(self, width: int, body_height: int) -> List[str]:')
          end = text.index('\n    def render(self) -> None:', start)
          modal = '''    def _panel_lines(\n        self, title: str, content: Sequence[str], width: int, body_height: int\n    ) -> List[str]:\n        """Render a centered bordered panel inside the terminal viewport."""\n        if width < 34:\n            return [clip_ansi(line, width) for line in content[:body_height]]\n        panel_width = min(88, max(34, width - 6))\n        inner_width = panel_width - 4\n        rendered: List[str] = []\n        for line in content:\n            rendered.extend(wrap_ansi(line, inner_width) if line else [""])\n        limit = max(1, body_height - 2)\n        if len(rendered) > limit:\n            rendered = rendered[: limit - 1] + [paint("… more release notes omitted", DIM, self.color)]\n        label = f" {title} "\n        dashes = max(0, panel_width - 2 - len(label))\n        top = "╭" + "─" * (dashes // 2) + label + "─" * (dashes - dashes // 2) + "╮"\n        bottom = "╰" + "─" * (panel_width - 2) + "╯"\n        if self.color:\n            top = paint(top, BOLD_LIGHT_CYAN, True)\n            bottom = paint(bottom, BOLD_LIGHT_CYAN, True)\n        panel = [top]\n        for line in rendered:\n            padded = line + " " * max(0, inner_width - len(strip_ansi(line)))\n            panel.append(f"{paint('│', CYAN, self.color)} {padded} {paint('│', CYAN, self.color)}")\n        panel.append(bottom)\n        indent = " " * max(0, (width - panel_width) // 2)\n        panel = [indent + line for line in panel]\n        return ([""] * max(0, (body_height - len(panel)) // 2) + panel)[:body_height]\n\n    def _update_modal_lines(self, width: int, body_height: int) -> List[str]:\n        release = self.update_release\n        if release is None:\n            return self._panel_lines("Update", ["No update is currently available.", "", "Press u to check GitHub again."], width, body_height)\n        if self.update_installing:\n            return self._panel_lines(\n                "Installing update",\n                [\n                    paint(f"htail {HTAIL_VERSION}  →  {release.version}", BOLD, self.color),\n                    "", "Downloading release…", "Verifying SHA-256 checksum…",\n                    "Replacing the executable atomically…", "",\n                    "The current file will reopen automatically.",\n                ],\n                width, body_height,\n            )\n        features, fixes, other = release_note_sections(release.notes)\n        content: List[str] = [\n            paint(f"htail {HTAIL_VERSION}  →  {release.version}", BOLD, self.color),\n            paint(self.update_service.repo if self.update_service else "", DIM, self.color),\n            "",\n        ]\n        if features:\n            content.append(paint("New features", BOLD_LIGHT_CYAN, self.color))\n            content.extend(f"• {item}" for item in features[:4])\n            content.append("")\n        if fixes:\n            content.append(paint("Bug fixes", BOLD_YELLOW, self.color))\n            content.extend(f"• {item}" for item in fixes[:4])\n            content.append("")\n        if not features and not fixes:\n            content.append(paint("Release notes", BOLD_LIGHT_CYAN, self.color))\n            content.extend(f"• {item}" for item in other[:5])\n            if not other:\n                content.append("No categorized release notes were provided.")\n            content.append("")\n        content.extend([\n            "A .bak copy of the current executable will be kept.",\n            f"After updating, htail will reopen {self.path.name}.",\n            "",\n            paint("[Y] Update now", BOLD + GREEN, self.color) + "    " + paint("[N] Cancel", BOLD, self.color),\n        ])\n        return self._panel_lines("Update available", content, width, body_height)\n'''
          text = text[:start] + modal + text[end:]

          old_render = '''        width, height = self.dimensions()\n        footer_height = self.footer_height(width)\n        body_height = max(1, height - footer_height)\n        self._ensure_layout(width)\n        self.top = min(max(0, self.top), self.max_scroll_top())\n\n        sys.stdout.write(CURSOR_HOME)\n        modal_lines = self._update_modal_lines(width, body_height) if self.update_confirm_active else None\n        help_lines = self._help_lines(width, body_height) if self.help_active and modal_lines is None else None\n'''
          new_render = '''        terminal_width, height = self.dimensions()\n        width = max(1, terminal_width - 1)\n        footer_height = self.footer_height(terminal_width)\n        body_height = max(1, height - footer_height)\n        self._ensure_layout(width)\n        self.top = min(max(0, self.top), self.max_scroll_top())\n\n        sys.stdout.write(CURSOR_HOME)\n        modal_lines = self._update_modal_lines(width, body_height) if self.update_confirm_active else None\n        help_lines = self._help_lines(width, body_height) if self.help_active and modal_lines is None else None\n'''
          assert old_render in text
          text = text.replace(old_render, new_render, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add release notes and regression tests
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # htail 0.7.3

          ## New features

          - Redesigned the in-app update confirmation as a centered terminal panel with clearer actions and version information.
          - The update panel now shows the GitHub release changelog directly inside htail, separated into New features and Bug fixes.
          - The footer now advertises `u check` even when no update is pending; pressing `u` forces an immediate GitHub release check.

          ## Bug fixes

          - Fixed a terminal row-accounting bug where content could disappear underneath the two-line footer while scrolling. htail now deliberately leaves the terminal's final physical column unused, preventing implicit terminal wrapping from consuming an extra row.
          EOF
          cat > tests/test_ui_regressions.py <<'PY'
          import importlib.machinery
          import importlib.util
          from pathlib import Path
          import sys
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          loader = importlib.machinery.SourceFileLoader("htail_ui_test_module", str(ROOT / "htail"))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          htail = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = htail
          loader.exec_module(htail)

          class UIRegressionTests(unittest.TestCase):
              def make_ui(self, service=None):
                  return htail.TerminalUI(Path("example.md"), htail.SyntaxHighlighter(Path("example.md"), "none", False), htail.DisplayFilter(), False, 300, update_service=service)

              def test_content_width_reserves_last_terminal_column(self):
                  ui = self.make_ui(); ui.dimensions = lambda: (120, 30)
                  self.assertEqual(ui.content_width(), 119)

              def test_release_notes_are_categorized(self):
                  features, fixes, other = htail.release_note_sections("## New features\n- Better modal\n\n## Bug fixes\n- Footer fix\n")
                  self.assertEqual(features, ["Better modal"]); self.assertEqual(fixes, ["Footer fix"]); self.assertEqual(other, [])

              def test_update_panel_contains_categories_and_actions(self):
                  ui = self.make_ui(htail.UpdateService("example/repo"))
                  ui.update_release = htail.ReleaseInfo(version="0.7.4", tag="v0.7.4", asset_url="x", asset_name="htail", checksum_url="y", notes="## New features\n- Better modal\n\n## Bug fixes\n- Footer fix\n")
                  visible = "\n".join(htail.strip_ansi(x) for x in ui._update_modal_lines(90, 25))
                  self.assertIn("New features", visible); self.assertIn("Bug fixes", visible); self.assertIn("[Y] Update now", visible)

              def test_footer_advertises_manual_update_check(self):
                  ui = self.make_ui(htail.UpdateService("example/repo")); ui.dimensions = lambda: (120, 30)
                  self.assertIn("u check", "\n".join(ui._status_lines(119, 28)))
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit and push 0.7.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htail RELEASE_NOTES.md tests/test_ui_regressions.py
          git commit -m "Release htail 0.7.3"
          git push origin HEAD:main

      - name: Apply categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if gh release view v0.7.3 >/dev/null 2>&1; then
              gh release edit v0.7.3 --notes-file RELEASE_NOTES.md
              exit 0
            fi
            sleep 2
          done
          echo "v0.7.3 release did not appear in time" >&2
          exit 1
