name: Apply htail 0.7.3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.7.3 script patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          data = ''''''
          open('/tmp/update.patch','wb').write(gzip.decompress(base64.b64decode(data)))
          PY
          patch --dry-run -p1 < /tmp/update.patch
          patch -p1 < /tmp/update.patch

      - name: Add release notes and regression tests
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # htail 0.7.3

          ## New features

          - Redesigned the in-app update confirmation as a centered terminal panel with clearer actions and version information.
          - The update panel now shows the GitHub release changelog directly inside htail, separated into New features and Bug fixes.
          - The footer now advertises `u check` even when no update is pending; pressing `u` forces an immediate GitHub release check.

          ## Bug fixes

          - Fixed a terminal row-accounting bug where content could disappear underneath the two-line footer while scrolling. htail now deliberately leaves the terminal's final physical column unused, preventing implicit terminal wrapping from consuming an extra row.
          EOF
          cat > tests/test_ui_regressions.py <<'PY'
          import importlib.machinery
          import importlib.util
          from pathlib import Path
          import sys
          import unittest

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = ROOT / "htail"
          loader = importlib.machinery.SourceFileLoader("htail_ui_test_module", str(SCRIPT))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          htail = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = htail
          loader.exec_module(htail)

          class UIRegressionTests(unittest.TestCase):
              def make_ui(self, service=None):
                  return htail.TerminalUI(
                      Path("example.md"),
                      htail.SyntaxHighlighter(Path("example.md"), "none", False),
                      htail.DisplayFilter(),
                      False,
                      300,
                      update_service=service,
                  )

              def test_content_width_reserves_last_terminal_column(self):
                  ui = self.make_ui()
                  ui.dimensions = lambda: (120, 30)
                  self.assertEqual(ui.content_width(), 119)

              def test_release_notes_are_categorized(self):
                  features, fixes, other = htail.release_note_sections(
                      "## New features\n- Better modal\n\n## Bug fixes\n- Footer fix\n"
                  )
                  self.assertEqual(features, ["Better modal"])
                  self.assertEqual(fixes, ["Footer fix"])
                  self.assertEqual(other, [])

              def test_update_panel_contains_categories_and_actions(self):
                  service = htail.UpdateService("example/repo")
                  ui = self.make_ui(service)
                  ui.update_release = htail.ReleaseInfo(
                      version="0.7.4", tag="v0.7.4", asset_url="x",
                      asset_name="htail", checksum_url="y",
                      notes="## New features\n- Better modal\n\n## Bug fixes\n- Footer fix\n",
                  )
                  visible = "\n".join(
                      htail.strip_ansi(x) for x in ui._update_modal_lines(90, 25)
                  )
                  self.assertIn("New features", visible)
                  self.assertIn("Bug fixes", visible)
                  self.assertIn("[Y] Update now", visible)

              def test_footer_advertises_manual_update_check(self):
                  ui = self.make_ui(htail.UpdateService("example/repo"))
                  ui.dimensions = lambda: (120, 30)
                  status = "\n".join(ui._status_lines(119, 28))
                  self.assertIn("u check", status)

          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit and push 0.7.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htail RELEASE_NOTES.md tests/test_ui_regressions.py
          git commit -m "Release htail 0.7.3"
          git push origin HEAD:main

      - name: Apply categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if gh release view v0.7.3 >/dev/null 2>&1; then
              gh release edit v0.7.3 --notes-file RELEASE_NOTES.md
              exit 0
            fi
            sleep 2
          done
          echo "v0.7.3 release did not appear in time" >&2
          exit 1
