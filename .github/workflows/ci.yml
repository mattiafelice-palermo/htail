name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check RapidFuzz==3.14.5
      - name: Compile source
        run: python -m compileall -q src tools tests benchmarks
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0
      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail
      - name: Smoke test bundle
        env:
          PYTHONPATH: src
        run: |
          actual="$(python /tmp/htail --version)"
          expected="$(python -c 'from htail_app import VERSION; print(f"htail {VERSION}")')"
          echo "$actual"
          test "$actual" = "$expected"
          python /tmp/htail --bundle-self-test
