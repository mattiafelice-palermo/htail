name: Apply htail 0.8.2 fixes

on:
  push:
    branches:
      - fix/input-rendering-0.8.2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply fixes
        run: python tools/apply_082.py

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail

      - name: Smoke test bundle
        shell: bash
        run: |
          test "$(python /tmp/htail --version)" = "htail 0.8.2"
          python /tmp/htail --no-self-install-prompt | grep -F "Usage: ht FILE [FILE ...]"

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix input and pane rendering in htail 0.8.2"
          git push origin HEAD:fix/input-rendering-0.8.2
