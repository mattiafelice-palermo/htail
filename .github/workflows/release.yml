name: Release htail

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/bundle-requirements.txt

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check RapidFuzz==3.14.5

      - name: Build standalone executable
        run: python tools/build_release.py --output dist/htail

      - name: Build native runtime assets
        run: python tools/build_runtime.py --output-dir dist

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(python dist/htail --version | awk '{print $2}')"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "HTAIL version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0

      - name: Smoke test native runtime asset
        run: python tools/build_runtime.py --self-test dist/htail-runtime-cp313.zip

      - name: Check existing published tag
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require version bump when product source changed
        if: steps.existing.outputs.published == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$TAG")"
          if ! git diff --quiet "$tag_commit"..HEAD -- src tools; then
            echo "Product source changed but $TAG already exists. Bump VERSION before publishing source changes." >&2
            exit 1
          fi

      - name: Prepare release assets
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x dist/htail
          sha256sum dist/htail > dist/htail.sha256
          for runtime in dist/htail-runtime-*.zip; do
            sha256sum "$runtime" > "$runtime.sha256"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          version = os.environ["VERSION"]
          notes = Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^# htail {re.escape(version)}[ \t]*$.*?(?=^# htail \S+[ \t]*$|\Z)",
              notes,
          )
          if match is None:
              raise SystemExit(f"release notes for htail {version} were not found")
          current = re.sub(r"(?mi)^[-*+]\s+None\.\s*$\n?", "", match.group(0)).strip() + "\n"
          Path("dist/release-notes.md").write_text(current, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          target="$(git rev-parse HEAD)"
          assets=(
            dist/htail
            dist/htail.sha256
            dist/htail-runtime-*.zip
            dist/htail-runtime-*.zip.sha256
          )

          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if (( attempt < 5 )); then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          resume_draft() {
            local state
            if ! state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
              return 1
            fi
            if [[ "$state" != "true" ]]; then
              return 1
            fi

            echo "Found interrupted draft for $TAG; resuming it."
            retry gh release upload "$TAG" "${assets[@]}" --clobber
            retry gh release edit "$TAG" \
              --target "$target" \
              --title "$TAG" \
              --notes-file dist/release-notes.md \
              --draft=false
          }

          # A transient 5xx from `gh release create` can leave a fully or
          # partially populated draft behind. Resume that draft instead of
          # treating its tag name as a published Git tag.
          if resume_draft; then
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
              --target "$target" \
              --title "$TAG" \
              --notes-file dist/release-notes.md \
              "${assets[@]}"; then
              exit 0
            fi

            # The failed request may nevertheless have created a draft.
            if resume_draft; then
              exit 0
            fi

            if (( attempt < 5 )); then
              sleep $((attempt * 5))
            fi
          done

          echo "Unable to publish $TAG after 5 attempts." >&2
          exit 1
