name: Release htail

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build standalone executable
        run: python tools/build_release.py --output dist/htail

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(python dist/htail --version | awk '{print $2}')"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "HTAIL version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0

      - name: Smoke test bundled native dependencies
        run: python dist/htail --bundle-self-test

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require version bump when product source changed
        if: steps.existing.outputs.exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$TAG")"
          if ! git diff --quiet "$tag_commit"..HEAD -- src tools; then
            echo "Product source changed but $TAG already exists. Bump VERSION before publishing source changes." >&2
            exit 1
          fi

      - name: Prepare release assets
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x dist/htail
          sha256sum dist/htail > dist/htail.sha256

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            dist/htail dist/htail.sha256
