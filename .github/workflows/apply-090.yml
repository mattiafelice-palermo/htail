name: Validate htail 0.9.0 integration

on:
  push:
    branches:
      - feature/sources-perf-0.9.0
    paths:
      - .github/patch_090.py
      - .github/workflows/apply-090.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sources-perf-0.9.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply integration patch
        run: python .github/patch_090.py
      - name: Compile
        run: python -m compileall -q src tools tests benchmarks
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail
      - name: Smoke test bundle
        run: test "$(python /tmp/htail --version)" = "htail 0.9.0"
      - name: Run synthetic benchmark
        env:
          PYTHONPATH: src
        run: python benchmarks/benchmark_htail.py --sizes 1 10 50 --iterations 3
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md tests docs benchmarks RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add stream sources and performance fast paths in htail 0.9.0"
          git push origin HEAD:feature/sources-perf-0.9.0
