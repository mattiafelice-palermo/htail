name: Stage htail 0.16.2

on:
  push:
    branches:
      - fix/global-search-render-0.16.2
    paths:
      - .github/workflows/stage-0162.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-search-render-0.16.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/bundle-requirements.txt
      - name: Apply fix and acceptance tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/htail_app/global_search.py")
          text = p.read_text(encoding="utf-8")
          old = 'score_suffix = f" · best {best:.0f}" if members and members[0].score is not None else ""'
          new = 'score_suffix = f" · best {best:.0f}" if members and members[0][1].score is not None else ""'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one grouped score access, found {text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")

          p = Path("src/htail_app/__init__.py")
          text = p.read_text(encoding="utf-8")
          if 'VERSION = "0.16.1"' not in text:
              raise SystemExit("unexpected version")
          p.write_text(text.replace('VERSION = "0.16.1"', 'VERSION = "0.16.2"'), encoding="utf-8")

          p = Path("tests/test_esc_global_0161.py")
          text = p.read_text(encoding="utf-8")
          old = """                self.assertGreater(width, 0)\n                self.assertIn('Global search', '\\n'.join(core.strip_ansi(row) for row in frame))\n"""
          new = """                self.assertGreater(width, 0)\n                screen = '\\n'.join(core.strip_ansi(row) for row in frame)\n                self.assertIn('Global search', screen)\n                self.assertIn('RESULTS', screen)\n                self.assertNotIn('Search rendering error', screen)\n                self.assertNotIn('AttributeError', screen)\n"""
          if text.count(old) != 1:
              raise SystemExit("could not strengthen 0.16.1 global-search regression")
          p.write_text(text.replace(old, new), encoding="utf-8")

          Path("tests/test_global_search_0162.py").write_text(r'''from __future__ import annotations

from pathlib import Path
import tempfile
import unittest

from htail_app import app, core
from htail_app.app import MultiApp
from htail_app.global_search import SORT_FILE, SORT_RELEVANCE, render_global_search
from htail_app.searching import (
    GlobalSearchMatch,
    SEARCH_BOOLEAN,
    SEARCH_FUZZY,
    SEARCH_REGEX,
    SEARCH_SIMPLE,
)


class GroupedRendererRegressionTests(unittest.TestCase):
    def test_non_fuzzy_grouped_result_has_no_score_attribute_error(self):
        result = GlobalSearchMatch(
            0, 0, "coord.md", "Workflow verification remains authoritative.", 9, 21, None
        )
        rows = render_global_search(
            120,
            28,
            query="verification",
            mode=SEARCH_SIMPLE,
            mode_labels=(
                (SEARCH_SIMPLE, "Simple"),
                (SEARCH_REGEX, "Regex"),
                (SEARCH_BOOLEAN, "Boolean"),
                (SEARCH_FUZZY, "Fuzzy"),
            ),
            ignore_case=True,
            sort_mode=SORT_FILE,
            file_filter_label="[All files]",
            results=[result],
            selected=0,
            truncated=False,
            error=None,
            panes=[],
            preview_enabled=False,
            color=True,
        )
        screen = "\n".join(core.strip_ansi(row) for row in rows)
        self.assertIn("coord.md", screen)
        self.assertIn("RESULTS — grouped by file", screen)
        self.assertNotIn("Search rendering error", screen)


class LiveGlobalSearchRenderMatrixTests(unittest.TestCase):
    def make_app(self, root: Path, color: bool) -> MultiApp:
        a = root / "coord.md"
        b = root / "reviewer.log"
        a.write_text(
            "Workflow verification remains authoritative.\n"
            "The verification record is complete.\n",
            encoding="utf-8",
        )
        b.write_text(
            "Reviewer verification passed.\n"
            "Final verification evidence recorded.\n",
            encoding="utf-8",
        )
        argv = [str(a), str(b), "--no-native-watch"]
        if not color:
            argv.append("--no-color")
        return MultiApp(app.parse_args(argv), color, core.DisplayFilter(), core.UpdateService(""))

    def render_clean(self, application: MultiApp, expected_heading: str | None = None) -> str:
        width, frame = application._frame_rows()
        self.assertGreater(width, 0)
        screen = "\n".join(core.strip_ansi(row) for row in frame)
        self.assertTrue(application.global_search_active)
        self.assertIn("Global search", screen)
        self.assertNotIn("Search rendering error", screen)
        self.assertNotIn("AttributeError", screen)
        self.assertNotIn("Traceback", screen)
        if expected_heading is not None:
            self.assertIn(expected_heading, screen)
        return screen

    def test_every_mode_renders_after_every_keystroke_and_control(self):
        cases = (
            (SEARCH_SIMPLE, 0, "verification", "RESULTS — grouped by file"),
            (SEARCH_REGEX, 1, "ver.*tion", "RESULTS — grouped by file"),
            (SEARCH_BOOLEAN, 2, "verification", "RESULTS — grouped by file"),
            (SEARCH_FUZZY, 3, "verifiction", "RESULTS — best matches"),
        )
        with tempfile.TemporaryDirectory() as td:
            root = Path(td)
            for color in (False, True):
                for mode, tabs, query, heading in cases:
                    with self.subTest(color=color, mode=mode):
                        application = self.make_app(root, color)
                        try:
                            application.handle_input("g")
                            self.render_clean(application)
                            for _ in range(tabs):
                                application.handle_input("TAB")
                                self.render_clean(application)
                            self.assertEqual(application.global_search_mode, mode)
                            for ch in query:
                                application.handle_input(ch)
                                self.render_clean(application, heading)
                            self.assertTrue(application.global_search_results)

                            # Exercise live controls through the same render path.
                            application.handle_input("DOWN")
                            self.render_clean(application, heading)
                            application.handle_input("CTRL_T")
                            self.render_clean(application, heading)
                            application.handle_input("CTRL_F")
                            self.render_clean(application, heading)
                            application.handle_input("CTRL_P")
                            self.render_clean(application, heading)

                            if mode == SEARCH_FUZZY:
                                self.assertEqual(application.global_search_sort, SORT_RELEVANCE)
                                application.handle_input("CTRL_O")
                                self.assertEqual(application.global_search_sort, SORT_FILE)
                                self.render_clean(application, "RESULTS — grouped by file")

                            application.handle_input("ESC")
                            self.assertFalse(application.global_search_active)
                        finally:
                            application.close_native_watch()


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          Path("RELEASE_NOTES.md").write_text('''# htail 0.16.2

## Bug fixes

- Fixed the global-search grouped-results renderer crashing on the first matching query in Simple, Regex and Boolean modes. Group members are `(index, result)` pairs; the renderer now reads fuzzy score metadata from the contained result rather than from the tuple itself.
- Strengthened the previous global-search containment regression so an error fallback no longer counts as a successful render.

## Validation

- Added an end-to-end live-render matrix covering Simple, Regex, Boolean and Fuzzy search in both color and no-color modes.
- The matrix renders the complete TUI after every typed character and after selection, case, file-filter, preview and fuzzy sort controls, and explicitly rejects any search-rendering error panel.
- Existing full test suite, v0.9.0 differential behavior gate, standalone core build and current-ABI native-runtime smoke test remain required before release.
''', encoding="utf-8")
          PY
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check RapidFuzz==3.14.5
      - name: Compile
        run: python -m compileall -q src tools tests benchmarks
      - name: Run full tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0
      - name: Build universal core
        run: time python tools/build_release.py --output /tmp/htail
      - name: Build and smoke current runtime
        run: |
          time python tools/build_runtime.py --output-dir /tmp/runtime --abi cp313
          python tools/build_runtime.py --self-test /tmp/runtime/htail-runtime-cp313.zip
      - name: Smoke core
        env:
          PYTHONPATH: src
        run: |
          actual="$(python /tmp/htail --version)"
          test "$actual" = "htail 0.16.2"
      - name: Commit clean product changes
        run: |
          rm .github/workflows/stage-0162.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix grouped global search rendering"
          git push origin HEAD:fix/global-search-render-0.16.2
