name: Apply htail 0.8.4 regressions
# validation-attempt-7

on:
  push:
    branches:
      - fix/cli-mouse-static-0.8.4
    paths:
      - .github/workflows/apply-084.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cli-mouse-static-0.8.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: |
          python .github/patch_084_v2.py
          python .github/post_patch_084.py
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail
      - name: Smoke test bundle
        run: |
          python /tmp/htail --version
          test "$(python /tmp/htail --version)" = "htail 0.8.4"
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests README.md RELEASE_NOTES.md
          git commit -m "Fix CLI progress mouse input and initial viewport in htail 0.8.4"
          git push origin HEAD:fix/cli-mouse-static-0.8.4
