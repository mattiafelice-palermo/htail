name: Stage htail 0.8.1 modal UI

on:
  push:
    branches:
      - feature/modal-ui-0.8.1

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply staged 0.8.1 payload
        shell: bash
        run: |
          base64 -d .staging/modal081.b64 | tar xzf -
          python - <<'PY'
          from pathlib import Path

          app = Path('src/htail_app/app.py')
          text = app.read_text(encoding='utf-8')
          text = text.replace('core.paint(top_plain, core.BOLD_LIGHT_CYAN, True)', 'core.paint(top_plain, core.BOLD_LIGHT_CYAN, color)')
          text = text.replace('core.paint(bottom_plain, core.BOLD_LIGHT_CYAN, True)', 'core.paint(bottom_plain, core.BOLD_LIGHT_CYAN, color)')
          text = text.replace('core.paint(side_plain, core.CYAN, True)', 'core.paint(side_plain, core.CYAN, color)')
          text = text.replace(
              '        rows = [_pad(line, width) for line in rows[:height]] + [" " * width] * max(0, height - len(rows))\n',
              '        if not color:\n            rows = [core.strip_ansi(row) for row in rows]\n        rows = [_pad(line, width) for line in rows[:height]] + [" " * width] * max(0, height - len(rows))\n',
              1,
          )
          text = text.replace(
              '    for line in content:\n        rendered.extend(core.wrap_ansi(line, inner_width) if line else [""])\n    limit = max(1, height - 4)\n',
              '    for line in content:\n        rendered.extend(core.wrap_ansi(line, inner_width) if line else [""])\n    if not color:\n        rendered = [core.strip_ansi(row) for row in rendered]\n    limit = max(1, height - 4)\n',
              1,
          )
          text = text.replace(
              '    for i, row in enumerate(panel_rows[:height]):\n        y = top_y + i\n        if 0 <= y < height:\n            out[y] = (" " * left) + row + (" " * max(0, width - left - len(core.strip_ansi(row))))\n    return out\n',
              '    for i, row in enumerate(panel_rows[:height]):\n        y = top_y + i\n        if 0 <= y < height:\n            out[y] = (" " * left) + row + (" " * max(0, width - left - len(core.strip_ansi(row))))\n    if not color:\n        out = [core.strip_ansi(row) for row in out]\n    return out\n',
              1,
          )
          app.write_text(text, encoding='utf-8')

          bundle = Path('tests/test_bundle.py')
          text = bundle.read_text(encoding='utf-8')
          text = text.replace('htail 0.8.0', 'htail 0.8.1')
          text = text.replace('HTAIL_VERSION = "0.8.0"', 'HTAIL_VERSION = "0.8.1"')
          bundle.write_text(text, encoding='utf-8')
          PY

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail

      - name: Smoke test bundle
        shell: bash
        run: |
          test "$(python /tmp/htail --version)" = "htail 0.8.1"
          python /tmp/htail --no-self-install-prompt | grep -F "Usage: ht FILE [FILE ...]"

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/htail_app/app.py src/htail_app/__init__.py RELEASE_NOTES.md tests/test_modal_ui.py tests/test_bundle.py
          git rm .staging/modal081.b64
          git commit -m "Add modal overlays and update progress for htail 0.8.1"
          git push origin HEAD:feature/modal-ui-0.8.1
