name: Seed htail 0.7.0 release

on:
  push:
    paths:
      - "release-bootstrap/ready"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test and prepare assets
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          test "$(python htail --version)" = "htail 0.7.0"
          chmod +x htail
          sha256sum htail > htail.sha256

      - name: Create initial release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            gh release upload v0.7.0 htail htail.sha256 --clobber
          else
            gh release create v0.7.0 htail htail.sha256 --target main --title "v0.7.0" --generate-notes
          fi
