name: Stage htail 0.16.3 hardening

on:
  push:
    branches:
      - fix/update-app-selection-0.16.3
    paths:
      - .github/workflows/stage-0163.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-app-selection-0.16.3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/bundle-requirements.txt
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check RapidFuzz==3.14.5
      - name: Apply staged source patches
        run: python tools/_stage_0163.py
      - name: Remove staging helpers
        run: rm tools/_stage_0163.py .github/workflows/stage-0163.yml
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Run full tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0
      - name: Build standalone executable
        run: python tools/build_release.py --output dist/htail
      - name: Build current runtime
        run: python tools/build_runtime.py --output-dir dist --abi cp313
      - name: Install runtime into isolated cache
        shell: bash
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/htail-cache"
          python - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          import zipfile

          outer_path = Path("dist/htail-runtime-cp313.zip")
          with zipfile.ZipFile(outer_path) as outer:
              manifest = json.loads(outer.read("runtime.json"))
              target = Path(os.environ["XDG_CACHE_HOME"]) / "htail" / "runtime" / manifest["runtime_id"] / manifest["abi"]
              target.mkdir(parents=True, exist_ok=True)
              for wheel_name in manifest["wheels"]:
                  with zipfile.ZipFile(io.BytesIO(outer.read("wheels/" + wheel_name))) as wheel:
                      wheel.extractall(target)
          print(target)
          PY
          XDG_CACHE_HOME="$XDG_CACHE_HOME" python dist/htail --bundle-self-test
      - name: Check clean patch
        run: |
          rm -rf dist
          git diff --check
          git status --short
      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden self-update app selection and verification"
          git push origin HEAD:fix/update-app-selection-0.16.3

# rerun after legacy updater fixtures were brought up to the verified-install contract
