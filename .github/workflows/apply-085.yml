name: Apply htail 0.8.5 fixes

on:
  push:
    branches:
      - fix/scroll-progress-0.8.5
    paths:
      - .github/patch_085.py
      - .github/workflows/apply-085.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scroll-progress-0.8.5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply patch
        run: python .github/patch_085.py
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail
      - name: Smoke test bundle
        env:
          PYTHONPATH: src
        run: |
          expected="$(python -c 'from htail_app import VERSION; print(f"htail {VERSION}")')"
          actual="$(python /tmp/htail --version)"
          echo "$actual"
          test "$actual" = "$expected"
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve scrolling and update UX in htail 0.8.5"
          git push origin HEAD:fix/scroll-progress-0.8.5
