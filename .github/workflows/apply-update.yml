name: Apply staged htail update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged 0.7.2 patch
        shell: bash
        run: |
          test -f update-0.7.2.patch
          sed -i 's/# Set this to "owner\/repository" once the public release repository exists\./# Public GitHub repository used for background release checks and self-update./' htail
          sed -i 's/# Until then HTAIL_UPDATE_REPO can be used to exercise the updater without/# HTAIL_UPDATE_REPO can override this for development\/testing./' htail
          sed -i '/^# changing the script\.$/d' htail
          sed -n '/^diff --git a\/README.md b\/README.md/,$p' update-0.7.2.patch > /tmp/update-0.7.2.patch
          patch --dry-run -p1 < /tmp/update-0.7.2.patch
          patch -p1 < /tmp/update-0.7.2.patch
          rm -f update-0.7.2.patch *.orig

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release htail 0.7.2"
          git push origin HEAD:main

      - name: Publish v0.7.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          chmod +x htail
          sha256sum htail > htail.sha256
          sha="$(git rev-parse HEAD)"
          if gh release view v0.7.2 >/dev/null 2>&1; then
            gh release upload v0.7.2 htail htail.sha256 --clobber
          else
            gh release create v0.7.2 --target "$sha" --title v0.7.2 --generate-notes htail htail.sha256
          fi
