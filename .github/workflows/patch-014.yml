name: Apply htail 0.14.0 search UX

on:
  push:
    branches:
      - feature/search-ux-0.14.0
    paths:
      - .github/patch_014.py
      - .github/workflows/patch-014.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-ux-0.14.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply patch
        run: python .github/patch_014.py
      - name: Compile
        run: python -m compileall -q src tools tests benchmarks
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compare invariant behavior with v0.9.0
        env:
          PYTHONPATH: src
        run: python benchmarks/reference_compare.py --reference v0.9.0
      - name: Build standalone executable
        run: python tools/build_release.py --output /tmp/htail
      - name: Smoke test bundle
        env:
          PYTHONPATH: src
        run: |
          actual="$(python /tmp/htail --version)"
          expected="$(python -c 'from htail_app import VERSION; print(f"htail {VERSION}")')"
          test "$actual" = "$expected"
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests README.md RELEASE_NOTES.md
          git commit -m "Refine inline search UX for htail 0.14.0"
          git push origin HEAD:feature/search-ux-0.14.0
